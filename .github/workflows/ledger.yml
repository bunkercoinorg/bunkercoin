name: Ledger

on:
  push:
    branches: [main]
    paths: ["ledger/**", "ledger_app.toml", ".github/workflows/ledger*.yml"]
  pull_request:
    paths: ["ledger/**", "ledger_app.toml", ".github/workflows/ledger*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ledger's metadata workflow reads ledger_app.toml at the repository root.
  # That manifest routes builds to ledger/ and supplies all four devices.
  build:
    name: Build application
    permissions:
      contents: read
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: ledger-binaries

  functional-tests:
    name: Speculos functional tests
    needs: build
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: ledger-binaries
      test_dir: ledger/tests/standalone
      run_for_devices: '["nanosp", "stax"]'
      test_options: --backend=speculos

  unit-tests:
    name: C unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    defaults:
      run:
        working-directory: ledger/unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure, build and run tests
        env:
          BOLOS_SDK: /opt/ledger-secure-sdk
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  coding-style:
    name: C coding style
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_lint.yml@v1
    with:
      source: ledger/src

  misspellings:
    name: Misspellings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: codespell-project/actions-codespell@v2
        with:
          path: ledger
          builtin: clear,rare
          check_filenames: true

  python-client:
    name: Python client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install pylint mypy -r tests/standalone/requirements.txt
      - name: Lint Python client
        run: pylint --rcfile=tests/application_client/setup.cfg tests/application_client/
      - name: Type check Python client
        run: mypy tests/application_client/

  documentation:
    name: Generate documentation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: doxygen .doxygen/Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-documentation
          path: ledger/doc/html
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.device }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        device: [nanox, nanosp, stax, flex]
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    defaults:
      run:
        working-directory: ledger
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build for analysis
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          sdk_var="${DEVICE^^}_SDK"
          make -j2 BOLOS_SDK="${!sdk_var}"
      - uses: github/codeql-action/analyze@v3
        with:
          category: ledger-${{ matrix.device }}
