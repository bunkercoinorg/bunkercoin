name: Apps

on:
  push:
    branches: [main]
    paths: ["apps/**", "package.json", "bun.lock", ".github/workflows/apps.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/**", "package.json", "bun.lock", ".github/workflows/apps.yml"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
